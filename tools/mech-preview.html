<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ED-209형 워커 · CORE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081019;color:#d4dee5;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100vh}#stage{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}.stamp{position:absolute;left:36px;top:30px;pointer-events:none}.stamp small{font:10px monospace;letter-spacing:.24em;color:#7e959f}.stamp h1{font-size:32px;font-weight:500;letter-spacing:.08em;margin:10px 0}.stamp p{color:#8aa0ad;margin:0;font-size:12px}.note{position:absolute;bottom:26px;left:36px;color:#77909c;font-size:11px;letter-spacing:.08em}aside{border-left:1px solid #1c303c;padding:36px 24px;background:#0c1721;overflow:auto}h2{font:11px monospace;letter-spacing:.15em;color:#67b9c7;margin:0 0 20px}h3{font-size:12px;font-weight:500;color:#91a6b2;margin:30px 0 12px}button{border:1px solid #304653;background:#12232f;color:#d2e0e6;padding:12px;cursor:pointer;border-radius:3px;font:inherit}button:hover,button[aria-pressed=true]{border-color:#64bbcc;background:#193644}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}label{display:block;font-size:12px;color:#90a6b5;margin:14px 0}input{width:100%;accent-color:#77c6d4}#export{margin-top:26px;width:100%;background:#b9d7dd;color:#0b202c;border:none;font-weight:600}#stats{font:11px/1.9 monospace;color:#8da6b5;white-space:pre-line}aside p{font-size:12px;color:#819aa8;line-height:1.8}a{color:#87c3d1} @media(max-width:700px){main{grid-template-columns:1fr;height:auto}#stage{height:70vh}aside{border-left:0;border-top:1px solid #1c303c;padding:24px}.stamp{left:20px;top:20px}.stamp h1{font-size:24px}}
</style></head><body><main><section id="stage"><div class="stamp"><small>CORE / WALKER ASSET</small><h1>ED—209</h1><p>리부트형 역관절 보행 병기</p></div><div class="note">드래그 회전 · 스크롤 확대</div></section><aside><h2>MODEL INSPECTION</h2><div id="stats"></div><h3>시점</h3><div class="row"><button id="front">정면</button><button id="rear">후면</button><button id="side">측면</button><button id="threeQuarter">입체</button></div><h3>관절 동작</h3><div class="row"><button id="idle" aria-pressed="true">대기</button><button id="walk">보행</button><button id="aim">조준</button></div><h3>실제 이동 시험</h3><p id="parameters" style="white-space:pre-line"></p><div class="row"><button id="forward">전진</button><button id="backward">후진</button><button id="left">좌측</button><button id="right">우측</button></div><div class="row" style="margin-top:8px"><button id="jump">점프</button><button id="dash">대시</button><button id="stop">정지</button><button id="resetMotion">초기화</button></div><p id="motionStats" style="white-space:pre-line" aria-live="off"></p><p>WASD 이동 · Space 점프 · Shift 대시<br>방향 버튼은 연속 이동합니다.</p><label>몸통 조준 방향<input id="yaw" type="range" min="-.8" max=".8" step=".01" value="0"></label><label>낮은 자세<input id="crouch" type="range" min="0" max="1" step=".01" value="0"></label><button id="export">GLB 에셋 내려받기</button><p>발바닥 기준 · 미터 단위<br>관절과 부착점이 보존된 3D 에셋<br>idle / walk / aim 애니메이션 포함</p><p>실제 보행 드론 설정과 게임 이동 컨트롤러를 사용하는 시험장입니다.<br>이동 중에는 기체를 따라가며 바닥 격자가 실제 속도로 흐릅니다.</p></aside></main><script type="module" src="/src/assets/WalkerPreview.ts"></script></body></html>
