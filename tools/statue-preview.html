<!doctype html><html lang="ko"><meta charset="utf-8"><title>광화문 동상 검토</title><style>body{margin:0;background:#cbd9e3;font:16px sans-serif}header{position:absolute;top:15px;left:20px}canvas{display:block}</style><header>세종대왕 · 이순신 장군 동상 — 드래그로 회전, 휠로 확대</header><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';import {statueGeometry,STATUES} from '/src/world/cities/GwanghwamunStatues.ts';
const scene=new THREE.Scene();scene.background=new THREE.Color('#cbd9e3');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,200);camera.position.set(17,16,36);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,7,0);controls.update();scene.add(new THREE.HemisphereLight(0xffffff,0x74776b,2));const sun=new THREE.DirectionalLight(0xffefda,3);sun.position.set(-10,25,20);scene.add(sun);
for(let i=0;i<2;i++){const a=STATUES[i],g=statueGeometry(a.id,a.x,a.z,0),m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.6,metalness:.2}));m.position.x=i?6:-6;scene.add(m);}const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0xbab4a8}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);renderer.setAnimationLoop(()=>renderer.render(scene,camera));window.onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};</script></html>
