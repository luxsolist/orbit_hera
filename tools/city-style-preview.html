<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 · 스타일 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee9df;color:#343c3b;font:14px system-ui}header{padding:18px 22px;background:#f5f1e8}h1{font-size:22px;margin:0 0 8px}p{margin:6px 0;color:#666b64}nav{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}button{background:#fffdf8;border:1px solid #c6cbbb;border-radius:6px;padding:9px 16px;cursor:pointer;color:#384942}button.active{background:#45695f;color:white;border-color:#45695f}#views{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 244px);min-height:420px;gap:2px;background:#ddd8cc}.pane{position:relative;overflow:hidden;min-width:0}.label{position:absolute;z-index:2;top:14px;left:14px;padding:8px 13px;border-radius:5px;background:#fffff0e8;color:#3b4e47;font-weight:600}canvas{display:block}footer{padding:8px 22px;font-size:12px}body.single #views{grid-template-columns:1fr}body.original #painted,body.painted #original{display:none}</style>
<header><h1>서울, 같은 장소 · 다른 표현</h1><p>동일한 건물과 도로, 동일한 카메라로 비교합니다. 오른쪽은 서울 사진의 애니메이션 변환본을 기준으로 조정한 표현입니다.</p><nav><button id="split" class="active">나란히 비교</button><button id="originalMode">기존 전체</button><button id="paintedMode">변경 전체</button><button id="streetView">고정 교차로</button><button id="wideView">같은 위치 넓게</button><button id="skyView">하늘·원경</button><button id="referenceOpen">기준 이미지 보기</button></nav><nav aria-label="시간대"><button id="timeLive">현지 현재 시간</button><button id="timeMorning">아침</button><button id="timeDay">낮</button><button id="timeEvening">저녁</button><button id="timeNight">밤</button><label>서울 시각 <input id="timeHour" aria-label="서울 시각" type="range" min="0" max="23.99" step="0.05" value="12"></label><output id="timeLabel"></output></nav></header>
<dialog id="referenceDialog" style="max-width:94vw;width:1200px;border:0;border-radius:10px;background:#f5f1e8;color:#343c3b"><h2>서울 사진에서 만든 스타일 기준</h2><p>밝은 상아색·회색 건물 / 청회색 그림자 / 짙은 올리브 녹지 / 거리별 명암 분리</p><img src="/art-direction/seoul-painted-reference-v1.png" alt="서울 사진을 수채화 애니메이션풍으로 변환한 기준 이미지" style="display:block;width:100%"><p>분위기와 색의 기준입니다. 아래 3D 비교 화면과 촬영 위치는 다릅니다.</p><button id="referenceClose">비교 화면으로 돌아가기</button></dialog>
<main id="views"><section class="pane" id="original"><span class="label">기존 · 도시 표현</span></section><section class="pane" id="painted"><span class="label">변경 · 사진 기준 애니메이션풍</span></section></main><footer id="status">서울 지도를 불러오는 중입니다.</footer>
<script type="module" src="/src/assets/CityStylePreview.ts"></script></html>
